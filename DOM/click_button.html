<!DOCTYPE html>
<html lang="en">

<head>
    <title>Add Surname</title>
</head>

<body>

    <h1 class="name">Himanshi</h1>
    <h1 class="name">Mehak</h1>
    <h1 class="name">Ashu</h1>
    <h1 class="name">Deepak</h1>

    <button id="btn">Change Name</button>

    <script>

        let btn = document.getElementById("btn");

        btn.addEventListener("click", function () {

            let names = document.getElementsByClassName("name");

            for (let i = 0; i < names.length; i++) {

                names[i].innerHTML = names[i].innerHTML + " Mehra";

            }

        });

    </script>

</body>

</html>
