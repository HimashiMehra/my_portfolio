<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact us</title>
    <link rel="stylesheet" href="form.css">
</head>

<body>
    <!-- <div class="meta"></div> -->
    <div class="form">
        <h1>Contact Us</h1>
        <br>
        <div class="name">

            <div class="box">
                <label>First Name *</label>
                <input type="text" required>
            </div>

            <div class="box">
                <label>Last Name *</label>
                <input type="text" required>
            </div>

        </div>

        <div class="email">
            <label>Email Address *</label>
            <input type="email" required>
        </div>

        <label>Query Type *</label>

        <div class="query1">

            <div class="query">
                <input type="radio" name="query">
                General Enquiry
            </div>

            <div class="query">
                <input type="radio" name="query">
                Support Request
            </div>

        </div>

        <div class="message">
            <label>Message *</label>
            <textarea></textarea>
        </div>

        <div class="check">
            <input type="checkbox">
            <p>I consent to being contacted by the team *</p>
        </div>

        <div class="submit">
            <button>Sumbit</button>
        </div>


    </div>
</body>

</html>
