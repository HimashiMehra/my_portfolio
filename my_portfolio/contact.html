<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Contact</title>
    <meta name="description" content="Get in touch with me.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation -->
    <header>
        <nav>
            <div class="logo">My<span>Portfolio</span></div>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="project.html">Projects</a>
                <a href="contact.html" class="active">Contact</a>
                <a href="videoDemo.html">Video Demo</a>
                <a href="report.html">Report</a>
            </div>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </nav>
    </header>

    <main class="contact-page">
        <section>
            <h1 class="section-title">Get In Touch</h1>
            
            <div class="contact-container">
                <div class="contact-info">
                    <div class="info-card">
                        <div class="info-icon">E</div>
                        <div class="info-text">
                            <h4>Email</h4>
                            <p>hello@alexdeveloper.com</p>
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon">P</div>
                        <div class="info-text">
                            <h4>Phone</h4>
                            <p>+1 234 567 890</p>
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon">L</div>
                        <div class="info-text">
                            <h4>LinkedIn</h4>
                            <a href="#">linkedin.com/in/alexdev</a>
                        </div>
                    </div>
                    <div class="info-card">
                        <div class="info-icon">G</div>
                        <div class="info-text">
                            <h4>GitHub</h4>
                            <a href="#">github.com/alexdev</a>
                        </div>
                    </div>

                    <!-- Google Map Embed -->
                    <div class="map-container">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d158858.47340002656!2d-0.2416812064253651!3d51.52855824164916!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x47d8a00baf21de75%3A0x52963a5addd52a99!2sLondon%2C%20UK!5e0!3m2!1sen!2s!4v1684334234551!5m2!1sen!2s" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>

                <div class="contact-form">
                    <form id="contactForm" action="mailto:hello@alexdeveloper.com" method="post" enctype="text/plain">
                        <div class="form-group">
                            <label for="name">Your Name</label>
                            <input type="text" id="name" name="name" placeholder="John Doe">
                        </div>
                        <div class="form-group">
                            <label for="email">Your Email</label>
                            <input type="email" id="email" name="email" placeholder="john@example.com">
                        </div>
                        <div class="form-group">
                            <label for="message">Message</label>
                            <textarea id="message" name="message" rows="6" placeholder="Write your message here..."></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="social-links">
            <a href="#" class="social-icon" aria-label="GitHub">GH</a>
            <a href="#" class="social-icon" aria-label="LinkedIn">LI</a>
            <a href="#" class="social-icon" aria-label="Twitter">TW</a>
        </div>
        <p class="footer-text">&copy; 2026 Alex Developer. All Rights Reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
